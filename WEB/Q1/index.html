    <!-- Paint splats — scattered across the wall -->

        <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

                    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>

    <div class="hero">
        <h1 class="title">𝓟𝓪𝓵𝓮𝓽𝓽𝓮</h1>
        <p class="hint">Look beyond what the eye can see</p>
    </div>

    <div class="footer">Level 1 &mdash; Web</div>

    <script>
        const title = document.querySelector('.title');

        const colors = [
            '#e63946',
            '#ff9800',
            '#ffeb3b',
            '#4caf50',
            '#2196f3',
            '#9c27b0',
            '#ff4081',
        ];

        let current = 0;
        let next = 1;
        let progress = 0;

        function lerpHex(a, b, t) {
            const ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16);
            const br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
            const r  = Math.round(ar + (br - ar) * t);
            const g  = Math.round(ag + (bg - ag) * t);
            const bl = Math.round(ab + (bb - ab) * t);
            return `rgb(${r},${g},${bl})`;
        }

        function animate() {
            progress += 0.004;
            if (progress >= 1) {
                progress = 0;
                current = next;
                next = (next + 1) % colors.length;
            }
            const color = lerpHex(colors[current], colors[next], progress);
            title.style.textShadow = `0 0 20px ${color}, 0 0 40px ${color}, 0 0 80px ${color}`;
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>

</body>
</html>
